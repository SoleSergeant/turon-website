<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vibe Turon logo concepts</title>
<style>
  :root{--navy:#283480;--violet:#6741D9;--violet-l:#B197FC;--bg:#F5F6FB}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font:15px/1.5 Inter,system-ui,sans-serif;color:#1d2340;padding:32px 16px}
  h1{font-size:22px;margin:0 0 4px}
  .lede{margin:0 0 24px;color:#4a5280;max-width:70ch}
  .grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));max-width:1120px}
  .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(40,52,128,.08),0 4px 16px rgba(40,52,128,.06)}
  .row{display:flex;align-items:center;justify-content:center;gap:24px;padding:28px 20px;flex-wrap:wrap}
  .row.dark{background:linear-gradient(135deg,#33409A,#283480 55%,#141B4D)}
  .row img.wm{height:72px;max-width:100%}
  .icons{display:flex;gap:16px;align-items:end}
  .icons img{display:block}
  .meta{padding:16px 20px 20px;border-top:1px solid #eceef6}
  .meta h2{margin:0 0 4px;font-size:17px}
  .meta p{margin:0;color:#4a5280}
  .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--violet);background:#F0EBFF;border-radius:99px;padding:2px 10px;margin-left:6px;vertical-align:2px}
</style>
</head>
<body>
<h1>Vibe Turon — logo concepts</h1>
<p class="lede">Unbounded ExtraBold, navy #283480 base, violet #6741D9 accent (light violet #B197FC on navy, like the gold rule). Each: wordmark on light and navy, plus the avatar tile at 64, 40 and 24&nbsp;px.</p>
<div class="grid" id="grid"></div>
<template id="t">
  <div class="card">
    <div class="row"><img class="wm l" alt=""></div>
    <div class="row dark"><img class="wm d" alt=""></div>
    <div class="row"><div class="icons">
      <img class="i1" width="64" height="64" alt=""><img class="i2" width="64" height="64" alt="">
      <img class="i1" width="40" height="40" alt=""><img class="i2" width="24" height="24" alt="">
    </div></div>
    <div class="meta"><h2></h2><p></p></div>
  </div>
</template>
<script src="preview.js"></script>
</body>
</html>
